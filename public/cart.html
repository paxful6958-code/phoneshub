<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zimbabwe Pride - Cart & Delivery</title>

    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient( 135deg, #e8ede8 0%, #f5f2e8 50%, #e8e8f0 100%);
            color: #111;
            padding: 15px;
        }
        
        .wrap {
            max-width: 930px;
            margin: auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, .25);
            overflow: hidden;
        }
        
        .top {
            background: #111;
            color: #fff;
            text-align: center;
            padding: 16px;
            font-size: 26px;
            font-weight: 1000;
            font-style: italic;
        }
        
        .top span {
            color: #f0c400;
        }
        
        .section-title {
            margin: 15px 25px 10px;
            background: #08751e;
            color: #fff;
            text-align: center;
            font-size: 20px;
            font-weight: 1000;
            font-style: italic;
            padding: 8px;
            border-radius: 8px;
        }
        
        .cart-list {
            padding: 0 25px;
        }
        
        .cart-item {
            display: flex;
            gap: 12px;
            align-items: center;
            border: 2px solid #08751e;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        .cart-item img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
        }
        
        .ci-name {
            font-weight: 1000;
            font-size: 16px;
            color: #08751e;
        }
        
        .ci-desc {
            font-size: 12px;
            color: #444;
            margin: 3px 0;
        }
        
        .ci-price {
            font-size: 12px;
            font-weight: 900;
        }
        
        .remove-btn {
            margin-left: auto;
            background: #c40000;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 10px;
            font-weight: 900;
            cursor: pointer;
        }
        
        .cart-total {
            margin: 10px 25px;
            text-align: right;
            font-weight: 1000;
            font-size: 18px;
        }
        
        form {
            padding: 0 25px 25px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        label {
            font-weight: 900;
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }
        
        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #08751e;
            border-radius: 8px;
            font-size: 15px;
        }
        
        .full {
            grid-column: 1 / -1;
        }
        /* =========================
   MAP
========================= */
        
        .map-container {
            margin-top: 10px;
            border: 2px solid #08751e;
            border-radius: 10px;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .map-title {
            background: #08751e;
            color: white;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 900;
        }
        
        #map {
            width: 100%;
            height: 350px;
        }
        
        .map-help {
            background: #fff;
            padding: 9px 10px;
            font-size: 12px;
            color: #555;
        }
        
        .location-status {
            margin-top: 8px;
            padding: 9px;
            background: #e9f8ed;
            color: #08751e;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
        }
        /* =========================
   BUTTON
========================= */
        
        .submit-btn {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient( 135deg, #08751e, #0a9a26);
            color: #fff;
            font-size: 19px;
            font-weight: 1000;
            cursor: pointer;
        }
        
        .submit-btn:hover {
            transform: scale(1.01);
        }
        
        .empty {
            text-align: center;
            padding: 30px;
            font-weight: 900;
            color: #c40000;
        }
        /* =========================
   MOBILE
========================= */
        
        @media(max-width:600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .top {
                font-size: 20px;
            }
            .cart-item {
                align-items: flex-start;
            }
            .remove-btn {
                padding: 6px;
                font-size: 11px;
            }
            #map {
                height: 300px;
            }
        }
    </style>
</head>


<body>

    <div class="wrap">

        <!-- HEADER -->

        <div class="top">
            🛒 YOUR CART &
            <span>DELIVERY DETAILS</span>
        </div>


        <!-- CART -->

        <div class="section-title">
            PHONES IN YOUR CART
        </div>

        <div class="cart-list" id="cartList">
        </div>

        <div class="cart-total" id="cartTotal">
        </div>


        <!-- DELIVERY -->

        <div class="section-title">
            DELIVERY INFORMATION
        </div>


        <form id="orderForm">

            <div class="form-grid">


                <!-- NAME -->

                <div>

                    <label>
                    Full Name *
                </label>

                    <input type="text" id="fullName" placeholder="Enter your full name" required>

                </div>


                <!-- PHONE -->

                <div>

                    <label>
                    Phone Number *
                </label>

                    <input type="tel" id="phone" placeholder="Enter phone number" required>

                </div>


                <!-- ID -->

                <div class="full">

                    <label>
                    ID Number (National ID / Passport) *
                </label>

                    <input type="text" id="idNumber" placeholder="National ID or Passport number" required>

                </div>


                <!-- CITY -->

                <div>

                    <label>
                    City / Town *
                </label>

                    <input type="text" id="city" placeholder="e.g. Harare, Nairobi, London" required>

                </div>


                <!-- SUBURB -->

                <div>

                    <label>
                    Suburb / Area
                </label>

                    <input type="text" id="suburb" placeholder="e.g. Avondale, Westlands">

                </div>


                <!-- ADDRESS + MAP -->

                <div class="full">

                    <label>
                    Full Delivery Address *
                </label>

                    <textarea id="address" rows="2" placeholder="Street, building, house number, apartment..." required></textarea>


                    <!-- MAP -->

                    <div class="map-container">

                        <div class="map-title">
                            📍 SELECT YOUR DELIVERY LOCATION
                        </div>

                        <div id="map"></div>

                        <div class="map-help">

                            Type your city, suburb and address. The map will search worldwide. You can also drag the marker to the exact delivery point.

                        </div>

                    </div>


                    <div id="locationStatus" class="location-status">

                        📍 Enter your delivery information to find your location.

                    </div>

                </div>


                <!-- DELIVERY DATE -->

                <div>

                    <label>
                    Preferred Delivery Day
                </label>

                    <input type="date" id="deliveryDate">

                </div>


                <!-- EMPLOYMENT -->

                <div>

                    <label>
                    Employment Status
                </label>

                    <select id="employment">

                    <option>
                        Employed
                    </option>

                    <option>
                        Self-Employed
                    </option>

                    <option>
                        Business Owner
                    </option>

                    <option>
                        Unemployed
                    </option>

                </select>

                </div>


                <!-- NOTES -->

                <div class="full">

                    <label>
                    Additional Notes
                </label>

                    <textarea id="notes" rows="2" placeholder="Additional delivery instructions..."></textarea>

                </div>

            </div>


            <button type="submit" class="submit-btn">

            ✅ SUBMIT ORDER

        </button>

        </form>

    </div>


    <!-- LEAFLET -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="">
    </script>


    <script>
        /* =====================================================
                   CART
                ===================================================== */

        var cart = JSON.parse(
            localStorage.getItem("zpCart") || "[]"
        );


        function renderCart() {

            var list =
                document.getElementById("cartList");


            if (!cart.length) {

                list.innerHTML =
                    '<div class="empty">' +
                    'Your cart is empty. ' +
                    '<a href="index.html">' +
                    'Go back and pick a phone!' +
                    '</a>' +
                    '</div>';

                document.getElementById(
                    "cartTotal"
                ).textContent = "";

                return;
            }


            list.innerHTML =
                cart.map(function(p, i) {

                    return (

                        '<div class="cart-item">' +

                        '<img src="' +
                        p.image +
                        '" alt="' +
                        p.name +
                        '">' +

                        '<div>' +

                        '<div class="ci-name">' +
                        p.name +
                        '</div>' +

                        '<div class="ci-desc">' +
                        p.desc +
                        '</div>' +

                        '<div class="ci-price">' +
                        'Deposit ' +
                        p.deposit +
                        ' • ' +
                        p.monthly +
                        '/month • ' +
                        p.total +
                        '</div>' +

                        '</div>' +

                        '<button ' +
                        'class="remove-btn" ' +
                        'onclick="removeItem(' +
                        i +
                        ')">' +

                        '✕ REMOVE' +

                        '</button>' +

                        '</div>'

                    );

                }).join("");

        }


        function removeItem(i) {

            cart.splice(i, 1);

            localStorage.setItem(
                "zpCart",
                JSON.stringify(cart)
            );

            renderCart();
        }


        renderCart();


        /* =====================================================
           WORLDWIDE MAP
        ===================================================== */

        /*
           Start with a worldwide view.

           We are NOT restricting the map to Zimbabwe.
        */

        var map =
            L.map("map").setView(
                [0, 20],
                2
            );


        /* OpenStreetMap */

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,

                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        /* Marker */

        var marker = L.marker(
            [0, 20], {
                draggable: true
            }
        ).addTo(map);


        /*
           Keep coordinates internally.

           They are NOT displayed to the customer.
        */

        var selectedLatitude = null;

        var selectedLongitude = null;


        /* =====================================================
           MOVE MARKER
        ===================================================== */

        function moveMarker(
            latitude,
            longitude,
            zoomLevel
        ) {

            selectedLatitude =
                latitude;

            selectedLongitude =
                longitude;


            marker.setLatLng([
                latitude,
                longitude
            ]);


            map.setView(
                [
                    latitude,
                    longitude
                ],
                zoomLevel || 16
            );


            document.getElementById(
                    "locationStatus"
                ).innerHTML =
                "📍 Delivery location selected.";
        }


        /* =====================================================
           SEARCH WORLDWIDE
        ===================================================== */

        var searchTimer;


        function searchLocation() {

            var city =
                document
                .getElementById("city")
                .value
                .trim();


            var suburb =
                document
                .getElementById("suburb")
                .value
                .trim();


            var address =
                document
                .getElementById("address")
                .value
                .trim();


            /*
               Build worldwide search query.

               NO country restriction.
            */

            var query = [
                    address,
                    suburb,
                    city
                ]
                .filter(Boolean)
                .join(", ");


            if (query.length < 5) {

                return;
            }


            clearTimeout(searchTimer);


            searchTimer =
                setTimeout(
                    async function() {

                        document.getElementById(
                                "locationStatus"
                            ).innerHTML =
                            "🔎 Searching worldwide for your location...";


                        try {

                            var url =
                                "https://nominatim.openstreetmap.org/search?" +
                                new URLSearchParams({

                                    q: query,

                                    format: "jsonv2",

                                    addressdetails: "1",

                                    limit: "5",

                                    /*
                                       IMPORTANT:
                                       No countrycodes parameter.
                                    */

                                    "accept-language": navigator.language || "en"

                                });


                            var response =
                                await fetch(url);


                            if (!response.ok) {

                                throw new Error(
                                    "Location search failed"
                                );
                            }


                            var results =
                                await response.json();


                            if (!results.length) {

                                document.getElementById(
                                        "locationStatus"
                                    ).innerHTML =
                                    "❌ Location not found. " +
                                    "Try adding a street, suburb, city or country.";

                                return;
                            }


                            /*
                               Use best matching result.
                            */

                            var result =
                                results[0];


                            var latitude =
                                parseFloat(
                                    result.lat
                                );


                            var longitude =
                                parseFloat(
                                    result.lon
                                );


                            moveMarker(
                                latitude,
                                longitude,
                                17
                            );


                            marker
                                .bindPopup(
                                    "📍 " +
                                    result.display_name
                                )
                                .openPopup();


                            document.getElementById(
                                    "locationStatus"
                                ).innerHTML =
                                "✅ Location found:<br>" +
                                result.display_name;


                        } catch (error) {

                            console.error(error);


                            document.getElementById(
                                    "locationStatus"
                                ).innerHTML =
                                "⚠️ Location search unavailable. " +
                                "You can drag the map marker manually.";

                        }

                    },
                    1000
                );
        }


        /* =====================================================
           SEARCH WHEN CUSTOMER TYPES
        ===================================================== */

        document
            .getElementById("city")
            .addEventListener(
                "input",
                searchLocation
            );


        document
            .getElementById("suburb")
            .addEventListener(
                "input",
                searchLocation
            );


        document
            .getElementById("address")
            .addEventListener(
                "input",
                searchLocation
            );


        /* =====================================================
           DRAG MARKER
        ===================================================== */

        marker.on(
            "dragend",
            async function() {

                var position =
                    marker.getLatLng();


                selectedLatitude =
                    position.lat;


                selectedLongitude =
                    position.lng;


                document.getElementById(
                        "locationStatus"
                    ).innerHTML =
                    "🔎 Identifying selected location...";


                /*
                   Reverse geocoding
                */

                try {

                    var url =
                        "https://nominatim.openstreetmap.org/reverse?" +
                        new URLSearchParams({

                            lat: position.lat,

                            lon: position.lng,

                            format: "jsonv2",

                            addressdetails: "1",

                            "accept-language": navigator.language || "en"

                        });


                    var response =
                        await fetch(url);


                    if (!response.ok) {

                        throw new Error(
                            "Reverse geocoding failed"
                        );
                    }


                    var data =
                        await response.json();


                    if (data.display_name) {

                        document.getElementById(
                                "address"
                            ).value =
                            data.display_name;


                        document.getElementById(
                                "locationStatus"
                            ).innerHTML =
                            "✅ Exact delivery point selected:<br>" +
                            data.display_name;

                    } else {

                        document.getElementById(
                                "locationStatus"
                            ).innerHTML =
                            "✅ Delivery point selected.";

                    }


                } catch (error) {

                    document.getElementById(
                            "locationStatus"
                        ).innerHTML =
                        "✅ Delivery point selected.";

                }

            }
        );


        /* =====================================================
           FORM SUBMISSION
        ===================================================== */

        document
            .getElementById("orderForm")
            .addEventListener(
                "submit",
                function(e) {

                    e.preventDefault();


                    if (!cart.length) {

                        alert(
                            "Your cart is empty!"
                        );

                        return;
                    }


                    /*
                       Make sure customer selected
                       a map location.
                    */

                    if (
                        selectedLatitude === null ||
                        selectedLongitude === null
                    ) {

                        alert(
                            "Please select your delivery location on the map."
                        );

                        return;
                    }


                    var order = {

                        customer: {

                            name: document
                                .getElementById("fullName")
                                .value,

                            phone: document
                                .getElementById("phone")
                                .value,

                            idNumber: document
                                .getElementById("idNumber")
                                .value,

                            city: document
                                .getElementById("city")
                                .value,

                            suburb: document
                                .getElementById("suburb")
                                .value,

                            address: document
                                .getElementById("address")
                                .value,

                            deliveryDate: document
                                .getElementById("deliveryDate")
                                .value,

                            employment: document
                                .getElementById("employment")
                                .value,

                            notes: document
                                .getElementById("notes")
                                .value,

                            /*
                               Coordinates are stored internally.
                            */

                            latitude: selectedLatitude,

                            longitude: selectedLongitude

                        },


                        items: cart,


                        date: new Date().toLocaleString()

                    };


                    /* =================================================
                       SAVE ORDER
                    ================================================= */

                    var orders =
                        JSON.parse(
                            localStorage.getItem(
                                "zpOrders"
                            ) || "[]"
                        );


                    orders.push(order);


                    localStorage.setItem(
                        "zpOrders",
                        JSON.stringify(orders)
                    );


                    /* =================================================
                       WHATSAPP
                    ================================================= */

                    var msg =
                        "NEW ORDER — ZIMBABWE PRIDE%0A%0A";


                    order.items.forEach(
                        function(p, i) {

                            msg +=
                                "PHONE " +
                                (i + 1) +
                                ": " +
                                p.name +
                                "%0A";

                            msg +=
                                "Deposit: " +
                                p.deposit +
                                " | Monthly: " +
                                p.monthly +
                                " | " +
                                p.total +
                                "%0A";

                            msg +=
                                "Specs: " +
                                p.desc +
                                "%0A%0A";

                        }
                    );


                    msg +=
                        "DELIVERY INFO:%0A";


                    msg +=
                        "Name: " +
                        order.customer.name +
                        "%0A";


                    msg +=
                        "Phone: " +
                        order.customer.phone +
                        "%0A";


                    msg +=
                        "ID: " +
                        order.customer.idNumber +
                        "%0A";


                    msg +=
                        "Address: " +
                        order.customer.address +
                        ", " +
                        order.customer.city;


                    if (
                        order.customer.suburb
                    ) {

                        msg +=
                            ", " +
                            order.customer.suburb;

                    }


                    msg += "%0A";


                    /*
                       Clickable map location.
                    */

                    msg +=
                        "📍 MAP LOCATION:%0A" +
                        "https://www.google.com/maps?q=" +
                        order.customer.latitude +
                        "," +
                        order.customer.longitude +
                        "%0A";


                    msg +=
                        "Delivery date: " +
                        (
                            order.customer.deliveryDate ||
                            "ASAP"
                        ) +
                        "%0A";


                    msg +=
                        "Employment: " +
                        order.customer.employment +
                        "%0A";


                    if (
                        order.customer.notes
                    ) {

                        msg +=
                            "Notes: " +
                            order.customer.notes;

                    }


                    /* =================================================
                       OPEN WHATSAPP
                    ================================================= */

                    window.location.href =
                        "https://wa.me/263771234567?text=" +
                        msg;


                    /* Clear cart */

                    localStorage.removeItem(
                        "zpCart"
                    );

                }
            );
    </script>

</body>

</html>
```
